dataset: "dummy.csv"
task: classification
target: target

preprocessing:
  numerical:
    default:
      imputation: median
      scaling: standard
    columns:
      - names:
          - Age
        transforms:
          - robust
      - names:
          - Income
        transforms:
          - log1p
  categorical:
    default:
      imputation: most_frequent
      encoding: onehot

evaluation:
  cv:
    folds: 5
    strategy: stratified
  seeds:
    - 42
    - 123
  n_jobs: -1

models:
  logistic_regression:
    model__C: [0.1, 1.0]
  random_forest:
    model__n_estimators: [50]
    model__max_depth: [5]

statistics:
  enabled: true
  method: wilcoxon
  correction: holm
  confidence_intervals:
    enabled: true
    level: 0.95
    bootstrap_samples: 500

audit:
  thresholds:
    missing_percentage: 15
    class_imbalance_ratio: 3

report:
  title: "v0.3 Feature Preprocessing and Statistics Test"
  sections:
    - overview
    - dataset
    - preprocessing
    - comparison
    - statistics
    - audit
    - advisor
    - reproducibility