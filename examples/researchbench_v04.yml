dataset: "dummy2.csv"
task: classification
target: target

subgroups:
  - Gender

preprocessing:
  text:
    columns:
      - Review
    vectorizer: tfidf
  numerical:
    default:
      scaling: standard

evaluation:
  strategy: group_kfold
  group_column: Patient_ID
  cv:
    folds: 2
  n_jobs: -1

models:
  logistic_regression: {}

statistics:
  enabled: true
  method: 5x2cv
  correction: holm
