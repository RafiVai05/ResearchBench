[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "researchbench"
version = "0.2.0"
description = "An open-source research quality-control laboratory for machine-learning experiments."
readme = "README.md"
authors = [
    { name = "ResearchBench Contributors", email = "hello@example.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "build",
    "twine"
]

[project.scripts]
researchbench = "researchbench.cli:main"

[tool.setuptools]
packages = ["researchbench", "researchbench.dataset", "researchbench.evaluation", "researchbench.audit", "researchbench.advisor", "researchbench.reporting", "researchbench.utils"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"